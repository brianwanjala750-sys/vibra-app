services:
  - type: web
    name: vibra-media
    runtime: python
    plan: 0.5c-512mb
    region: frankfurt
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python "import os.py"
    healthCheckPath: /api/auth/session
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: VIBRA_DATA_DIR
        value: /opt/render/project/src/instance
      - key: VIBRA_COOKIE_SECURE
        value: "1"
      - key: TRUST_PROXY
        value: "1"
      - key: VIBRA_RATE_LIMIT_STORAGE_URL
        value: memory://
    disk:
      name: vibra-data
      mountPath: /opt/render/project/src/instance
      sizeGB: 1
